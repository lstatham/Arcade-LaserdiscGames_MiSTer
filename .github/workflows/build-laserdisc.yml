name: Build LaserdiscGames core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk and move docker storage to /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo systemctl stop docker || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker || sudo service docker start || true
          df -h / /mnt

      - name: Compile with Quartus 17.0.2
        run: |
          docker run --rm -u 0 -v "$PWD":/build -w /build ryanfb/quartus-mister:latest bash -lc '
            QB="/opt/intelFPGA_lite/17.0/quartus/bin"
            # Quartus 17 bundles an old libstdc++ that clashes with the image tcmalloc
            # (missing CXXABI_1.3.8 / GLIBCXX_3.4.21); drop it so the loader uses the
            # newer system libstdc++, the documented fix for Quartus on modern glibc.
            rm -f /opt/intelFPGA_lite/17.0/quartus/linux64/libstdc++.so.6* 2>/dev/null || true
            export PATH="$QB:$PATH"
            which quartus_sh
            quartus_sh --version 2>&1 | head -2
            quartus_sh --flow compile Arcade-LaserdiscGames
          '

      - name: Show outputs
        if: always()
        run: |
          echo "== rbf / sof produced =="
          find . -iname "*.rbf" -o -iname "*.sof" 2>/dev/null | head
          ls -la output_files 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laserdiscgames-rbf
          path: |
            **/*.rbf
            output_files/*.sof
            output_files/*.fit.summary
            output_files/*.flow.rpt
            output_files/*.sta.rpt
          retention-days: 7
          if-no-files-found: warn
